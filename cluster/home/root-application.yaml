apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-cluster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 192.168.1.4:23000/stephanvanlanduyt/kluster.git
    targetRevision: main
    path: clusters/home
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true