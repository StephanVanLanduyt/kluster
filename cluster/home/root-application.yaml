apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-cluster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@192.168.1.4:222/stephanvanlanduyt/kluster.git
    targetRevision: master
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true