apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: databasus
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ssh://git@192.168.1.4:222/stephanvanlanduyt/kluster.git
      targetRevision: master
      path: apps/databasus/manifests
    - repoURL: ghcr.io/databasus/charts
      chart: databasus
      targetRevision: 3.62.0
      helm:
        releaseName: databasus
        values: |
          nodeSelector:
            kubernetes.io/hostname: newton
          ingress:
            enabled: true
            className: traefik
            hosts:
              - host: databasus.newton.local
                paths:
                  - path: /
                    pathType: Prefix
          persistence:
            enabled: true
            storageClassName: local-path
            accessMode: ReadWriteOnce
            size: 10Gi
            mountPath: /databasus-data
          service:
            type: ClusterIP
            port: 4005
            targetPort: 4005
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
          logFileIsEnabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: databasus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true