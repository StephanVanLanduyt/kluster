apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: garage

resources:
  - namespace.yaml
  - sealed-secrets.yaml
  - service.yaml
  - statefulset.yaml

configMapGenerator:
  - name: garage-config
    files:
      - garage.toml

generatorOptions:
  disableNameSuffixHash: false