apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: garage
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3-api
      port: 3900
      targetPort: 3900
      nodePort: 30900
    - name: rpc
      port: 3901
      targetPort: 3901
    - name: admin
      port: 3903
      targetPort: 3903