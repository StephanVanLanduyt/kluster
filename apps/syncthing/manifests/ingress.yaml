apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: syncthing-ingress
  namespace: syncthing
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: syncthing.newton.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: syncthing-svc
                port:
                  number: 8384