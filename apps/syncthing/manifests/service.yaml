apiVersion: v1
kind: Service
metadata:
  name: syncthing-svc
  namespace: syncthing
spec:
  type: ClusterIP
  selector:
    app: syncthing
  ports:
    - port: 8384
      targetPort: http
      name: http
    - port: 22000
      targetPort: sync-tcp
      name: sync-tcp
      protocol: TCP
    - port: 22000
      targetPort: sync-udp
      name: sync-udp
      protocol: UDP
    - port: 21027
      targetPort: discovery
      name: discovery