apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spotify-notifier
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@192.168.1.4:222/stephanvanlanduyt/kluster.git
    targetRevision: master
    path: apps/spotify/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: spotify
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true