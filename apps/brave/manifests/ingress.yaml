apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brave-ingress
  namespace: brave
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.serverstransport: brave-transport@kubernetescrd
spec:
  tls:
    - hosts:
      - brave.newton.local
  rules:
    - host: brave.newton.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brave-svc
                port:
                  name: https