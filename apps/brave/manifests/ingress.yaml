apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brave-ingress
  namespace: brave
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/service.serversscheme: https
spec:
  rules:
    - host: brave.newton.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brave-svc
                port:
                  number: 3001