apiVersion: apps/v1
kind: Deployment
metadata:
  name: brave
  namespace: brave
  labels:
    app: brave
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brave
  template:
    metadata:
      labels:
        app: brave
    spec:
      nodeSelector:
        kubernetes.io/hostname: newton
      containers:
        - name: brave
          image: lscr.io/linuxserver/brave:1.98.60@sha256:dbeaa02622e3cdb25a781f4c72f46f16259e214bf00617e22e6636445635df6d
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "Europe/Rome"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 3001
              name: https
          volumeMounts:
            - name: appdata
              mountPath: /config
            - name: nfs-shares
              mountPath: /shares
            - name: dshm
              mountPath: /dev/shm
          resources:
            limits:
              cpu: 3
              memory: 6Gi
            requests:
              cpu: 1.5
              memory: 3Gi
      volumes:
        - name: appdata
          persistentVolumeClaim:
            claimName: brave-appdata-pvc
        - name: nfs-shares
          persistentVolumeClaim:
            claimName: brave-nfs-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi