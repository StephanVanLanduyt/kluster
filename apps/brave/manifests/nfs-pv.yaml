apiVersion: v1
kind: PersistentVolume
metadata:
  name: brave-nfs-pv
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=2
  nfs:
    server: 192.168.1.4
    path: /mnt/storage/shares
    readOnly: false