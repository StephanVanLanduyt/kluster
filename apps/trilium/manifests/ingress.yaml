apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trilium-ingress
  namespace: trilium
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: trilium.newton.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trilium-svc
                port:
                  number: 8080