apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: filebrowser-ingress
  namespace: filebrowser
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: filebrowser.newton.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: filebrowser-svc
                port:
                  number: 80