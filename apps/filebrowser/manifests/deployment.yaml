apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: filebrowser
  labels:
    app: filebrowser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      nodeSelector:
        kubernetes.io/hostname: newton
      containers:
        - name: filebrowser
          image: gtstef/filebrowser:2.0.2-stable@sha256:de2b4c4d18485ea202ab2cdada5bd25d8f0b8ed071712c8216a67194c31285ae
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nfs-shares
              mountPath: /srv
            - name: appdata
              mountPath: /database
              subPath: database
            - name: appdata
              mountPath: /home/filebrowser/data
              subPath: data
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 128Mi
      volumes:
        - name: nfs-shares
          persistentVolumeClaim:
            claimName: filebrowser-nfs-pvc
        - name: appdata
          persistentVolumeClaim:
            claimName: filebrowser-appdata-pvc