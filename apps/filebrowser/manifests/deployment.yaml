apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: filebrowser
  labels:
    app: filebrowser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      nodeSelector:
        kubernetes.io/hostname: newton
      containers:
        - name: filebrowser
          image: gtstef/filebrowser:1.5.8@sha256:68455d4953bad8e984e1bc5d112ed1e9c918a0a04f104c13c9ece50790308894
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nfs-shares
              mountPath: /srv
            - name: appdata
              mountPath: /database
              subPath: database
            - name: appdata
              mountPath: /home/filebrowser/data
              subPath: data
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 128Mi
      volumes:
        - name: nfs-shares
          persistentVolumeClaim:
            claimName: filebrowser-nfs-pvc
        - name: appdata
          persistentVolumeClaim:
            claimName: filebrowser-appdata-pvc