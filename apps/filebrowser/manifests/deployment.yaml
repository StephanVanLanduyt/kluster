apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: filebrowser
  labels:
    app: filebrowser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      nodeSelector:
        kubernetes.io/hostname: newton
      containers:
        - name: filebrowser
          image: gtstef/filebrowser:2.1.0-stable@sha256:17de8d0ac6a6bcfd5ef9aca43d6c0aa2fd031a07d6ee9b8a3b7c6c646efe35bf
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nfs-shares
              mountPath: /srv
            - name: appdata
              mountPath: /database
              subPath: database
            - name: appdata
              mountPath: /home/filebrowser/data
              subPath: data
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 128Mi
      volumes:
        - name: nfs-shares
          persistentVolumeClaim:
            claimName: filebrowser-nfs-pvc
        - name: appdata
          persistentVolumeClaim:
            claimName: filebrowser-appdata-pvc