apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: filebrowser-appdata-backup
  namespace: filebrowser
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  sourcePVC: filebrowser-appdata-pvc

  trigger:
    schedule: "0 3 * * *"

  restic:
    repository: volsync-filebrowser
    copyMethod: Direct
    pruneIntervalDays: 28
    retain:
      hourly: 0
      daily: 7
      weekly: 4
      monthly: 12
      yearly: 0
    exclude:
      caches: true