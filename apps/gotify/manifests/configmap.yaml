apiVersion: v1
kind: ConfigMap
metadata:
  name: gotify-config
  namespace: gotify
data:
  TZ: "Europe/Rome"
  GOTIFY_SERVER_PORT: "80" # the port the HTTP server will listen on
  GOTIFY_SERVER_KEEPALIVEPERIODSECONDS: "0" # 0 = use Go default (15s)
  GOTIFY_SERVER_SSL_ENABLED: "false" # if https should be enabled
  GOTIFY_SERVER_SSL_REDIRECTTOHTTPS: "true" # redirect to https if site is accessed by http
  GOTIFY_SERVER_SSL_PORT: "443" # the https port
  GOTIFY_SERVER_SSL_LETSENCRYPT_ENABLED: "false" # if the certificate should be requested from letsencrypt
  GOTIFY_SERVER_SSL_LETSENCRYPT_ACCEPTTOS: "false" # if you accept the tos from letsencrypt
  GOTIFY_SERVER_SSL_LETSENCRYPT_CACHE: data/certs # the directory of the cache from letsencrypt
  GOTIFY_SERVER_STREAM_PINGPERIODSECONDS: "45" # the interval in which websocket pings will be sent.
  GOTIFY_SERVER_SECURECOOKIE: "false" # If the secure flag should be set on cookies.
  GOTIFY_DATABASE_DIALECT: sqlite3
  GOTIFY_DATABASE_CONNECTION: data/gotify.db
  GOTIFY_PASSSTRENGTH: "10" # the bcrypt password strength
  GOTIFY_UPLOADEDIMAGESDIR: data/images # the directory for storing uploaded images
  GOTIFY_PLUGINSDIR: data/plugins # the directory where plugin resides 
  GOTIFY_REGISTRATION: "false" # enable registrations
  GOTIFY_OIDC_ENABLED: "false" # Enable OpenID Connect login, allowing users to authenticate via an external identity provider 
  GOTIFY_OIDC_REDIRECTURL: http://gotify.example.org/auth/oidc/callback
  GOTIFY_OIDC_AUTOREGISTER: "true"
  GOTIFY_OIDC_USERNAMECLAIM: preferred_username