apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitor-kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: ssh://git@192.168.1.4:222/stephanvanlanduyt/kluster.git
      targetRevision: master
      path: apps/monitor/manifests
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.21.1
      helm:
        releaseName: kps
        valuesObject:
          crds:
            enabled: true

          prometheusOperator:
            admissionWebhooks:
              enabled: true
            nodeSelector:
              kubernetes.io/os: linux
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi

          prometheus:
            enabled: true

            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: web
              hosts:
                - prometheus.newton.local
              paths:
                - /
              pathType: Prefix

            prometheusSpec:
              externalUrl: http://prometheus.newton.local
              retention: 10d
              retentionSize: "18GiB"
              scrapeInterval: 30s
              walCompression: true

              nodeSelector:
                kubernetes.io/os: linux
                kubernetes.io/hostname: newton

              resources:
                requests:
                  cpu: 500m
                  memory: 2Gi
                limits:
                  cpu: 2000m
                  memory: 4Gi

              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: local-path
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 20Gi

              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelectorNilUsesHelmValues: false
              probeSelectorNilUsesHelmValues: false
              scrapeConfigSelectorNilUsesHelmValues: false
              ruleSelectorNilUsesHelmValues: false

          alertmanager:
            enabled: true
            alertmanagerSpec:
              nodeSelector:
                kubernetes.io/os: linux
                kubernetes.io/hostname: newton
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              storage:
                volumeClaimTemplate:
                  spec:
                    storageClassName: local-path
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 2Gi
            config:
              global:
                resolve_timeout: 5m
              route:
                group_by: ["namespace", "alertname", "severity"]
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 4h
                receiver: "node-red-webhook"
                routes:
                  - matchers:
                      - alertname = NodeFilesystemAlmostOutOfSpace
                      - device = /dev/sda1
                      - instance = "192.168.1.5:9100"
                      - mountpoint = /boot
                    receiver: "null"
                  - matchers:
                      - alertname = Watchdog
                    receiver: "null"
                  - matchers:
                      - alertname = KubeMemoryOvercommit
                    receiver: "null"
                  - matchers:
                      - alertname = KubeCPUOvercommit
                    receiver: "null"
                  - matchers:
                      - alertname = InfoInhibitor
                    receiver: "null"
              receivers:
                - name: "null"
                - name: "node-red-webhook"
                  webhook_configs:
                    - url: "http://nodered.nodered.svc.cluster.local.:1880/prometheus-webhook"
                      send_resolved: true
                      max_alerts: 10
              inhibit_rules:
                # Critical silences warning for the same alert
                - source_matchers:
                    - severity = critical
                  target_matchers:
                    - severity =~ warning|info
                  equal: ["alertname", "namespace"]
                # Node down silences all pod alerts on that node
                - source_matchers:
                    - alertname = KubeNodeNotReady
                  target_matchers:
                    - severity =~ warning|info
                  equal: ["node"]
                - source_matchers:
                    - alertname = InfoInhibitor
                  target_matchers:
                    - severity = info
                  equal: ["namespace"]
          additionalPrometheusRulesMap:
            custom-app-rules:
              groups:
                - name: app.rules
                  rules:
                    # Pod memory approaching limits
                    - alert: PodMemoryNearLimit
                      expr: |
                        container_memory_working_set_bytes
                        / container_spec_memory_limit_bytes > 0.9
                        and container_spec_memory_limit_bytes > 0
                      for: 10m
                      labels:
                        severity: warning
                      annotations:
                        summary: "Pod {{ $labels.pod }} memory usage above 90% of limit"
                        description: "Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) is using {{ $value | humanizePercentage }} of its memory limit."
                # - name: test.rules
                #   rules:
                #     - alert: TestAlertPipeline
                #       expr: vector(1)
                #       for: 1m
                #       labels:
                #         severity: warning
                #       annotations:
                #         summary: "Test alert — safe to ignore"
                #         description: "This alert validates the notification pipeline. Delete the test-alert PrometheusRule to resolve."

          grafana:
            enabled: true

            admin:
              existingSecret: grafana-admin
              userKey: admin-user
              passwordKey: admin-password

            defaultDashboardsEnabled: true
            defaultDashboardsTimezone: "Europe/Rome"

            deploymentStrategy:
              type: Recreate

            persistence:
              enabled: true
              type: pvc
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              size: 5Gi
              finalizers:
                - kubernetes.io/pvc-protection

            nodeSelector:
              kubernetes.io/os: linux
              kubernetes.io/hostname: newton

            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 1Gi

            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: web
              hosts:
                - grafana.newton.local
              path: /
              pathType: Prefix

            grafana.ini:
              server:
                domain: grafana.newton.local
                root_url: http://grafana.newton.local
              users:
                allow_sign_up: false
              log:
                level: info

          nodeExporter:
            enabled: true
          kubeStateMetrics:
            enabled: true
          kubelet:
            enabled: true

          kubeApiServer:
            enabled: true
          coreDns:
            enabled: true
          kubeControllerManager:
            enabled: false
          kubeScheduler:
            enabled: false
          kubeProxy:
            enabled: false
          kubeEtcd:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - ServerSideDiff=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers: ["/webhooks/0/clientConfig/caBundle"]
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers: ["/webhooks/0/clientConfig/caBundle"]