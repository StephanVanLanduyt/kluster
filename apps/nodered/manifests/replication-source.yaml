apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: nodered-data-backup
  namespace: nodered
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  sourcePVC: nodered-data-pvc

  trigger:
    schedule: "0 0/6 * * *"

  restic:
    repository: volsync-nodered
    copyMethod: Direct
    pruneIntervalDays: 28
    retain:
      hourly: 0
      daily: 7
      weekly: 4
      monthly: 12
      yearly: 0
    exclude:
      caches: true