apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodered
  namespace: nodered
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodered
  template:
    metadata:
      labels:
        app: nodered
    spec:
      nodeSelector:
        kubernetes.io/hostname: newton
      containers:
        - name: node-red
          image: nodered/node-red:5.0.10@sha256:3622786c15b6f57f61bf1d0ece59d06a18b742c5c8955f588d189b6bee8dc97d
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1880
          envFrom:
            - configMapRef:
                name: nodered-config
          volumeMounts:
            - name: nodered-data
              mountPath: /data
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: nodered-data
          persistentVolumeClaim:
            claimName: nodered-data-pvc