apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodered
  namespace: nodered
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodered
  template:
    metadata:
      labels:
        app: nodered
    spec:
      nodeSelector:
        kubernetes.io/hostname: newton
      containers:
        - name: node-red
          image: nodered/node-red:5.0.4@sha256:10f40d0a83e7e5852b13d4d472b2006b05b1cca6d55e2f29a55a12c25a630cb6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1880
          envFrom:
            - configMapRef:
                name: nodered-config
          volumeMounts:
            - name: nodered-data
              mountPath: /data
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: nodered-data
          persistentVolumeClaim:
            claimName: nodered-data-pvc