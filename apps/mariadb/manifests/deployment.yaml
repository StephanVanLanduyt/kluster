apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate

  progressDeadlineSeconds: 900
  revisionHistoryLimit: 5
  minReadySeconds: 20

  selector:
    matchLabels:
      app: mariadb

  template:
    metadata:
      labels:
        app: mariadb
    spec:
      nodeSelector:
        kubernetes.io/hostname: newton

      securityContext:
        fsGroup: 999

      terminationGracePeriodSeconds: 120

      containers:
        - name: mariadb
          image: mariadb:11.8.9@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707
          imagePullPolicy: IfNotPresent
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_general_ci
            - --innodb-buffer-pool-size=256M
            - --max-connections=100

          ports:
            - containerPort: 3306
              name: mysql

          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: MARIADB_ROOT_PASSWORD
            - name: KUMA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: KUMA_DB_PASSWORD
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
            - name: TZ
              value: "Europe/Rome"
          
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 512Mi
          
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            failureThreshold: 60     # up to 10 min for first init / auto-upgrade
            timeoutSeconds: 5
          
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mariadb-data-pvc
        - name: initdb
          configMap:
            name: mariadb-initdb
            defaultMode: 0755