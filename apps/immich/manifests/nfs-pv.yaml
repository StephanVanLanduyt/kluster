apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-nfs-pv
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=2
  nfs:
    server: 192.168.1.4
    path: /mnt/storage/shares/Pictures
    readOnly: true
  claimRef:
    namespace: immich
    name: immich-nfs-pvc