apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yamtrack-ingress
  namespace: yamtrack
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: yamtrack.newton.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yamtrack-service
                port: 
                  number: 8000