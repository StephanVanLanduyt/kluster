apiVersion: apps/v1
kind: Deployment
metadata:
  name: cocktails-backend
  namespace: cocktails
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cocktails-backend
  template:
    metadata:
      labels:
        app: cocktails-backend
    spec:
      containers:
        - name: backend
          image: '192.168.1.4:23000/stephanvanlanduyt/cocktails-backend:'
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: cocktails-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cocktails-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cocktails-secrets
                  key: POSTGRES_PASSWORD
            - name: PG_DSN
              value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@cocktails-db:5432/$(POSTGRES_DB)
