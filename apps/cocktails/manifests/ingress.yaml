apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cocktails-ingress
  namespace: cocktails
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: cocktails.newton.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cocktails-frontend
                port:
                  number: 80