apiVersion: apps/v1
kind: Deployment
metadata:
  name: cocktails-frontend
  namespace: cocktails
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cocktails-frontend
  template:
    metadata:
      labels:
        app: cocktails-frontend
    spec:
      containers:
        - name: frontend
          image: '192.168.1.4:23000/stephanvanlanduyt/cocktails-frontend:1.0.202609152326'
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
