apiVersion: apps/v1
kind: Deployment
metadata:
  name: cocktails-db
  namespace: cocktails
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cocktails-db
  template:
    metadata:
      labels:
        app: cocktails-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: newton
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: postgres
          image: postgres:15.18@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: cocktails-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cocktails-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data/
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: db-pvc